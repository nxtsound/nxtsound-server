name: Release

# Releases are cut by tags (the project is trunk-based: `main` is the only long-lived branch; merging publishes nothing).
#   v0.2.0         stable: builds the image (tags 0.2.0, 0.2, latest) and prepares a DRAFT release with the notes from CHANGELOG.md.
#                  Check the notes and press "Publish": only a published release counts as stable for the servers' update check.
#   v0.2.0-beta.1  beta: builds the image (tags 0.2.0-beta.1, beta; "latest" does not move) and publishes a PRE-RELEASE with the notes.
#                  Servers on the beta channel are told about it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # creates the release
  packages: write   # pushes the image

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=auto   # "latest" only for stable versions, never for a pre-release
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-') }}
      - name: Version of this release
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"   # v0.2.0-beta.1 -> 0.2.0-beta.1
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            VERSION=${{ steps.ver.outputs.version }}
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          python3 tools/release_notes.py "$GITHUB_REF_NAME" > release-notes.md
          if [ -s release-notes.md ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.found == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: ${{ !contains(github.ref_name, '-') }}
